[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# The test runner imports each test module only when it runs it.
"scripts/selfcheck.py" = ["PLC0415"]
# The layout tables are kept as a wide grid that reads across the keyboard.
"miryoku/layout.py" = ["E501"]
# Win32 functions keep their Windows names, one prototype per line.
"winapi/*.py" = ["E501", "N816", "PLR0917"]
# Dependency stubs preserve the pinned SDK's actual method names.
"typings/win32more/**/*.pyi" = ["N801", "N802", "N815"]

[tool.setuptools]
py-modules = ["components", "config", "diagnostics", "launch", "protocol", "usage"]

[tool.setuptools.packages.find]
include = ["assistant*", "contracts*", "desktop_ui*", "automation*", "gateway*", "link*", "miryoku*", "winapi*"]

[tool.setuptools.package-data]
assistant = ["*.ps1", "*.yaml"]
desktop_ui = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.workspace.architecture]

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Engine"
expression = "Engine"
reason = "The isolated keyboard path uses bounded mutable buffers and direct updates; scripts/benchmark_keyboard.py measures their latency, allocation and GC."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Modifiers"
expression = "Modifiers"
reason = "Modifier ownership counters are updated for every key event inside the measured keyboard path; copying them would add per-event allocation."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.sdk"
declaration = "TextBuffer"
expression = "TextBuffer"
reason = "Private streaming accumulators update growing fragment maps and completion sets; persistent copies per fragment add substantial cumulative work. Published timeline values remain immutable."

[[tool.workspace.architecture.exceptions]]
rule = "plain-record"
module = "assistant.sdk"
declaration = "MemorySession"
expression = "MemorySession"
reason = "The Agents SDK's Session protocol declares session_id and session_settings writable, so a frozen record does not satisfy it."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-parameter"
module = "assistant.sdk"
declaration = "MemorySession.add_items.items"
expression = "list[TResponseInputItem]"
reason = "The Agents SDK's Session protocol dictates the signature; MemorySession implements it structurally and only reads the items."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-parameter"
module = "assistant.sdk"
declaration = "after_tools.results"
expression = "list[FunctionToolResult]"
reason = "The Agents SDK's ToolsToFinalOutputFunction, passed as tool_use_behavior, dictates the signature; the results are not read."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-parameter"
module = "scripts.benchmark_keyboard"
declaration = "measure_latencies.observe_gc.info"
expression = "dict[str, int]"
reason = "gc.callbacks dictates the callback's signature; the benchmark only reads the collection's generation."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-parameter"
module = "scripts.benchmark_keyboard"
declaration = "round_latencies.observe_gc"
expression = "Callable[[str, dict[str, int]], None]"
reason = "The callback is appended to gc.callbacks, whose element type dictates its signature."
