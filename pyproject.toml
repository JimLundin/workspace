[tool.ruff.lint.pylint]
max-args = 3
max-positional-args = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Protected owners resolve candidate/runtime imports after activation.
"keeper.py" = ["PLC0415"]
"selfcheck.py" = ["PLC0415"]
# The layout tables are kept as a wide grid that reads across the keyboard.
"miryoku/layout.py" = ["E501"]
# Win32 functions keep their Windows names, one prototype per line.
"winapi/*.py" = ["E501", "N816", "PLR0917"]
# Dependency stubs preserve the pinned SDK's actual method names.
"typings/win32more/**/*.pyi" = ["N801", "N802"]

[tool.setuptools]
py-modules = ["components", "config", "diagnostics", "keeper", "keeper_control", "keeper_ui", "protocol", "runtime", "selfcheck", "usage"]

[tool.setuptools.packages.find]
include = ["assistant*", "automation*", "miryoku*", "winapi*"]

[tool.setuptools.package-data]
assistant = ["*.ps1", "*.yaml"]

[tool.workspace.architecture]
# Model ownership follows module moves; mutable effect owners are not models.
models = [
    "assistant.control_policy",
    "assistant.agent_session",
    "assistant.communications",
    "assistant.feed_triage",
    "assistant.notification_sources",
    "assistant.recording_state",
    "assistant.system_notices",
    "automation.task",
]

[[tool.workspace.architecture.exceptions]]
rule = "explicit-attributes"
module = "assistant.meeting_followup_store"
declaration = "FollowupStore._publish"
expression = "getattr(error, 'winerror', None)"
reason = "Read the optional native OSError code for bounded publication retry after Windows sharing/access errors."

[[tool.workspace.architecture.exceptions]]
rule = "explicit-attributes"
module = "selfcheck"
declaration = "run_tests"
expression = "getattr(test, '__module__', None)"
reason = "The protected runner inspects discovered test callables to verify their defining module."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Engine"
expression = "Engine"
reason = "The isolated keyboard path uses bounded mutable buffers and direct updates; docs/functional-design.md records latency, allocation and GC measurements."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Modifiers"
expression = "Modifiers"
reason = "Modifier ownership counters are updated for every key event inside the measured keyboard path; copying them would add per-event allocation."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.sdk"
declaration = "TextBuffer"
expression = "TextBuffer"
reason = "Private streaming accumulators update growing fragment maps and completion sets; persistent copies per fragment add substantial cumulative work. Published timeline values remain immutable."
