[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "openai-agents==0.24.0",
    "openai==3.35.1",
    "pydantic==2.14.1",
    "markdown-it-py==4.0.0",
    "httpx==0.28.1",
    "websockets==16.1.1",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "win32more-core==0.8.7; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Contracts==0.8.10.0.28000.2705; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Win32Metadata==0.8.71.0.26; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["hypothesis==6.170.12"]
dev = ["watchdog==6.0.0"]

[tool.mypy]
mypy_path = "typings"
custom_typeshed_dir = "typings/.workspace-typeshed"
python_version = "3.15"
platform = "win32"  # the workspace targets Windows; check it as Windows code
strict = true
# No Any, anywhere: not written, not inferred, not hidden behind a decorator or import.
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true

[tool.pyright]
stubPath = "typings"
typeshedPath = "typings/.workspace-typeshed"
pythonVersion = "3.15"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py315"
line-length = 150
extend-include = ["*.pyw"]
# Preserve vendored upstream declarations; lint consumed local stubs separately.
extend-exclude = ["typings/.workspace-typeshed"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "RET", "TID252"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913"]

# Required Qt virtual methods and Win32 boundary signatures retain native names.
[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "settings",
    "_lru_cache_wrapper",
