[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# The layout tables are kept as a wide grid that reads across the keyboard.
"settings/layout.py" = ["E501"]
"tests/layouts.py" = ["E501"]
# Win32 functions keep their Windows names, one prototype per line.
"winapi/*.py" = ["E501", "N816", "PLR0917"]
# Dependency stubs preserve the pinned SDK's actual method and structure field names.
"typings/win32more/**/*.pyi" = ["N801", "N802", "N803", "N815"]

[tool.setuptools]
py-modules = ["cell", "diagnostics", "launch", "protocol"]

[tool.setuptools.packages.find]
include = ["assistant*", "contracts*", "desktop_ui*", "gateway*", "keyboard*", "settings*", "winapi*"]

[tool.setuptools.package-data]
desktop_ui = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.workspace.architecture]
constants = ["keyboard", "settings", "desktop"]
# The entry points (launch.py and each program's __main__) build the chosen
# values from the data packages and hand them in.
data = ["settings", "desktop"]
entries = ["launch", "scripts.benchmark_keyboard"]

# Each program's code imports only its own packages and the shared ones
# (protocol, contracts, winapi, cell, diagnostics, and its data through its entry).
[[tool.workspace.architecture.programs]]
name = "launcher"
packages = ["launch"]

[[tool.workspace.architecture.programs]]
name = "gateway"
packages = ["gateway"]

[[tool.workspace.architecture.programs]]
name = "layout"
packages = ["keyboard"]

[[tool.workspace.architecture.programs]]
name = "desktop"
packages = ["desktop", "desktop_ui", "assistant"]

[[tool.workspace.architecture.exceptions]]
rule = "mutable-parameter"
module = "scripts.benchmark_keyboard"
declaration = "measure_latencies.observe_gc.info"
expression = "dict[str, int]"
reason = "gc.callbacks dictates the callback's signature; the benchmark only reads the collection's generation."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-parameter"
module = "scripts.benchmark_keyboard"
declaration = "round_latencies.observe_gc"
expression = "Callable[[str, dict[str, int]], None]"
reason = "The callback is appended to gc.callbacks, whose element type dictates its signature."

[[tool.workspace.architecture.exceptions]]
rule = "unused-definition"
module = "winapi.inputs"
declaration = "send_scancodes"
expression = "send_scancodes"
reason = "A native test tool: the end-to-end test presses physical keys through winapi's private SendInput binding."

[[tool.workspace.architecture.exceptions]]
rule = "unused-definition"
module = "winapi.system"
declaration = "run_message_loop"
expression = "run_message_loop"
reason = "A native test tool: the pointer target pumps its window's messages through winapi's private message bindings."
