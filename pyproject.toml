[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "openai-agents==0.24.0",
    "openai==3.35.1",
    "pydantic==2.14.1",
    "markdown-it-py==4.0.0",
    "httpx==0.28.1",
    "websockets==16.1.1",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "win32more-core==0.8.7; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Contracts==0.8.10.0.28000.2705; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Win32Metadata==0.8.71.0.26; sys_platform == 'win32'",
    # Development checks; kept in the runtime group until the dev group carries them.
    "ruff==0.17.3",
    "pyright==1.1.414",
    "truststore==0.10.5",
]

[dependency-groups]
dev = ["hypothesis==6.170.12", "watchdog==6.0.0"]

[tool.uv]
# Not a package: environments hold only its dependencies (`uv sync --no-install-project`).
package = false
# Every transitive dependency stays exactly where it was pinned; `uv lock` writes uv.lock from these.
constraint-dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "certifi==2026.10.18",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "cryptography==50.0.2",
    "griffelib==2.3.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.14.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "httpx2==2.14.0",
    "idna==3.20",
    "jiter==0.17.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "markdown-it-py==4.0.0",
    "mcp==1.30.0",
    "mdurl==0.1.2",
    "openai==3.35.1",
    "openai-agents==0.24.0",
    "pycparser==3.11",
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "pydantic-settings==2.16.1",
    "PyJWT==2.15.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "pywin32==312; sys_platform == 'win32'",
    "referencing==0.37.0",
    "requests==2.34.2",
    "rpds-py==2026.9.1",
    "sniffio==1.3.1",
    "sse-starlette==3.5.0",
    "starlette==1.9.0",
    "truststore==0.10.5",
    "typing_extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "websockets==16.1.1",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "shiboken6==6.12.0; sys_platform == 'win32'",
    "win32more-core==0.8.7; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Contracts==0.8.10.0.28000.2705; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Win32Metadata==0.8.71.0.26; sys_platform == 'win32'",
    "nodeenv==1.11.0",
    "pyright==1.1.414",
    "ruff==0.17.3",
]

[tool.pyright]
stubPath = "typings"
typeshedPath = "typings/.workspace-typeshed"
pythonVersion = "3.15"
pythonPlatform = "Windows"
typeCheckingMode = "strict"
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]

[tool.ruff]
target-version = "py315"
line-length = 150
extend-include = ["*.pyw"]
# Preserve upstream typeshed declarations; lint consumed local stubs separately.
# Agent worktrees under .claude are separate checkouts with their own checks.
extend-exclude = ["typings/.workspace-typeshed", ".claude"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "RET", "TID252", "FBT001", "FBT002"]
ignore = ["PLR2004", "PLR0911", "PLR0912"]

# Required Qt virtual methods and Win32 boundary signatures retain native names.
[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "settings",
