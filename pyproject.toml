[[tool.workspace.architecture.exceptions]]
rule = "mutable-field"
module = "assistant.llm"
declaration = "ToolSpec.parameters"
expression = "dict[str, Json]"
reason = "Existing tool schemas are mutable JSON dictionaries. Introduce immutable schemas together with explicit JSON conversion in the SDK and HTTP adapters."
kind = "migration"

[[tool.workspace.architecture.exceptions]]
rule = "explicit-attributes"
module = "assistant.meeting_followup_store"
declaration = "FollowupStore._publish"
expression = "getattr(error, 'winerror', None)"
reason = "Read the optional native OSError code for bounded publication retry after Windows sharing/access errors."
kind = "necessity"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.overlay"
declaration = "OverlayState"
expression = "OverlayState"
reason = "Existing overlay callers expect in-place updates. Replace them with immutable transitions in a focused native-view change; no performance necessity is claimed."
kind = "migration"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.sdk"
declaration = "TextBuffer"
expression = "TextBuffer"
reason = "Private streaming accumulators update growing fragment maps and completion sets; persistent copies per fragment add substantial cumulative work. Published timeline values remain immutable."
kind = "necessity"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "automation.bridge"
declaration = "PendingMeeting"
expression = "PendingMeeting"
reason = "Existing committed automation.bridge.PendingMeeting uses PendingMeeting; migrate this exact declaration to the documented policy when changing its owner."
kind = "migration"

[[tool.workspace.architecture.exceptions]]
