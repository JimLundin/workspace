[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "openai-agents==0.24.0",
    "markdown-it-py==4.0.0",
    "httpx==0.28.1",
    "websockets==16.1.1",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "PySide6-WebEngine==6.12.0.140; sys_platform == 'win32'",
    "win32more-core==0.8.7; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Contracts==0.8.10.0.28000.2705; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Win32Metadata==0.8.71.0.26; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["hypothesis==6.170.12"]

[tool.mypy]
mypy_path = "typings"
python_version = "3.15"
platform = "win32"  # the toolkit targets Windows; check it as Windows code
strict = true
# No Any, anywhere: not written, not inferred, not hidden behind a decorator or import.
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The ctypes, GUI, SDK and inspection boundaries: values inside may be Any
# until converted; every public signature is concrete, so nothing untyped leaves.
module = ["winapi", "winapi.*", "assistant.ui", "assistant.agent_panel", "assistant.work_panel", "assistant.agent_toasts", "assistant.qt_text", "assistant.qt_ui", "assistant.toast_card", "assistant.sdk", "selfcheck"]
disallow_any_expr = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Native canvas widgets have the same typed Qt signal boundary as the conversation.
module = ["assistant.canvas_ui", "assistant.canvas_web", "assistant.canvas_widgets", "assistant.canvas_launcher", "assistant.widgets", "assistant.canvas_icons", "assistant.meeting_panel", "keeper_ui"]
disallow_any_expr = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Generated WinRT bindings are validated inside the native composition boundary.
module = ["win32more", "win32more.*"]
ignore_missing_imports = true

[tool.pyright]
stubPath = "typings"
pythonVersion = "3.15"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py315"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "RET"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913"]

[tool.ruff.lint.pylint]
max-args = 3
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
# The layout tables are kept as a wide grid that reads across the keyboard.
"miryoku/layout.py" = ["E501"]
# Win32 functions keep their Windows names, one prototype per line.
"winapi/*.py" = ["E501", "N816", "PLR0917"]

[tool.setuptools]
py-modules = ["config", "keeper", "keeper_ui", "protocol", "runtime", "selfcheck", "usage"]

[tool.setuptools.packages.find]
include = ["assistant*", "automation*", "miryoku*", "winapi*"]

[tool.setuptools.package-data]
assistant = ["*.ps1", "canvas_assets/*", "canvas_assets/examples/*"]

[tool.workspace.architecture]
models = ["assistant.agent_session", "assistant.recording_state", "automation.task"]

[[tool.workspace.architecture.exceptions]]
rule = "mutable-field"
module = "assistant.agent"
declaration = "Args.values"
expression = "dict[str, object]"
reason = "Existing tool arguments retain mutable parsed JSON. Freeze validated nested data at ingress while preserving the external encoding in its adapter."
kind = "migration"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.agent_execution"
declaration = "Conversation"
expression = "Conversation"
reason = "Existing committed assistant.agent_execution.Conversation uses Conversation; migrate this exact declaration to the documented policy when changing its owner."
kind = "migration"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.agent_input"
declaration = "_Input"
expression = "_Input"
reason = "Existing reply mailbox is shared by a waiting thread and its answer callback. Move mutable coordination into its effect owner before making the reply record immutable."
kind = "migration"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.browser_surfaces"
declaration = "_Surface"
expression = "_Surface"
reason = "Existing committed assistant.browser_surfaces._Surface uses _Surface; migrate this exact declaration to the documented policy when changing its owner."
kind = "migration"

