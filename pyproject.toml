[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "openai-agents==0.24.0",
    "markdown-it-py==4.0.0",
    "httpx==0.28.1",
    "websockets==16.1.1",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "PySide6-WebEngine==6.12.0.140; sys_platform == 'win32'",
    "win32more-core==0.8.7; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Contracts==0.8.10.0.28000.2705; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Win32Metadata==0.8.71.0.26; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["hypothesis==6.170.12"]
dev = ["watchdog==6.0.0"]

[tool.mypy]
mypy_path = "typings"
custom_typeshed_dir = "typings/.workspace-typeshed"
python_version = "3.15"
platform = "win32"  # the workspace targets Windows; check it as Windows code
strict = true
# No Any, anywhere: not written, not inferred, not hidden behind a decorator or import.
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The ctypes, GUI, SDK and inspection boundaries: values inside may be Any
# until converted; every public signature is concrete, so nothing untyped leaves.
module = ["winapi", "winapi.*", "assistant.ui", "assistant.work_panel", "assistant.agent_toasts", "assistant.qt_text", "assistant.qt_ui", "assistant.toast_card", "assistant.sdk", "selfcheck"]
disallow_any_expr = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Native panels share the typed Qt signal interface with the conversation.
module = ["assistant.panel_controls", "assistant.widgets", "assistant.vector_icons", "assistant.meeting_panel", "assistant.desktop_bar", "assistant.bar_button", "keeper_ui"]
disallow_any_expr = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Generated WinRT bindings are validated inside the native composition boundary.
module = ["win32more", "win32more.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These owners now consume focused native stubs without typing escapes.
module = ["winapi.composition", "winapi.composition_paths", "assistant.bar_surface"]
disallow_any_expr = true
disallow_any_explicit = true

[tool.pyright]
stubPath = "typings"
typeshedPath = "typings/.workspace-typeshed"
pythonVersion = "3.15"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py315"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "RET"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913"]

[tool.ruff.lint.pylint]
max-args = 3
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
# The layout tables are kept as a wide grid that reads across the keyboard.
"miryoku/layout.py" = ["E501"]
# Win32 functions keep their Windows names, one prototype per line.
"winapi/*.py" = ["E501", "N816", "PLR0917"]
# Dependency stubs preserve the pinned SDK's actual method names.
"typings/win32more/**/*.pyi" = ["N801", "N802"]

[tool.setuptools]
py-modules = ["config", "diagnostics", "keeper", "keeper_ui", "protocol", "runtime", "selfcheck", "usage"]

[tool.setuptools.packages.find]
include = ["assistant*", "automation*", "miryoku*", "winapi*"]

[tool.setuptools.package-data]
assistant = ["*.ps1", "*.yaml"]

[tool.workspace.architecture]
# Model ownership follows module moves; mutable effect owners are not models.
models = [
    "assistant.agent_session",
    "assistant.communications",
    "assistant.feed_triage",
    "assistant.native_feed",
    "assistant.recording_state",
    "assistant.system_notices",
    "automation.task",
]

[[tool.workspace.architecture.exceptions]]
rule = "explicit-attributes"
module = "assistant.meeting_followup_store"
declaration = "FollowupStore._publish"
expression = "getattr(error, 'winerror', None)"
reason = "Read the optional native OSError code for bounded publication retry after Windows sharing/access errors."

[[tool.workspace.architecture.exceptions]]
rule = "explicit-attributes"
module = "scripts.deploy_windows"
declaration = "Release.__init__"
expression = "getattr(library, name)"
reason = "Resolve fixed reviewed ctypes function declarations before assigning their concrete native prototypes."

[[tool.workspace.architecture.exceptions]]
rule = "explicit-attributes"
module = "selfcheck"
declaration = "run_tests"
expression = "getattr(test, '__module__', None)"
reason = "The protected runner inspects discovered test callables to verify their defining module."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Engine"
expression = "Engine"
reason = "The isolated keyboard path uses bounded mutable buffers and direct updates; docs/functional-design.md records latency, allocation and GC measurements."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Modifiers"
expression = "Modifiers"
reason = "Modifier ownership counters are updated for every key event inside the measured keyboard path; copying them would add per-event allocation."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.sdk"
declaration = "TextBuffer"
expression = "TextBuffer"
reason = "Private streaming accumulators update growing fragment maps and completion sets; persistent copies per fragment add substantial cumulative work. Published timeline values remain immutable."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.agent_input"
declaration = "_Input"
expression = "_Input"
kind = "migration"
reason = "Existing reply mailbox is shared by a waiting thread and its answer callback. Move mutable coordination into its effect owner before making the reply record immutable."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.overlay"
declaration = "OverlayState"
expression = "OverlayState"
kind = "migration"
reason = "Existing overlay callers expect in-place updates. Replace them with immutable transitions in a focused native-view change; no performance necessity is claimed."

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "assistant.shell_state"
declaration = "WindowsKeyTap"
expression = "WindowsKeyTap"
kind = "migration"
reason = "Existing Windows-key hook mutates held-key state. Measure its native callback before replacing that state; the current shape has no specific before/after evidence."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-field"
module = "assistant.agent"
declaration = "Args.values"
expression = "dict[str, object]"
kind = "migration"
reason = "Existing tool arguments retain mutable parsed JSON. Freeze validated nested data at ingress while preserving the external encoding in its adapter."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-field"
module = "assistant.agent_execution"
declaration = "Conversation.history"
expression = "list[Json]"
kind = "migration"
reason = "Existing volatile SDK history is shared by identity with Agent. Move its mutation behind the execution owner while preserving ADR-0001 recovery and privacy constraints."

[[tool.workspace.architecture.exceptions]]
rule = "mutable-field"
module = "assistant.llm"
declaration = "ToolSpec.parameters"
expression = "dict[str, Json]"
kind = "migration"
reason = "Existing tool schemas are mutable JSON dictionaries. Introduce immutable schemas together with explicit JSON conversion in the SDK and HTTP adapters."
