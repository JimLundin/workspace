expression = "_Flight"
reason = "Existing committed automation.controller._Flight uses _Flight; migrate this exact declaration to the documented policy when changing its owner."
kind = "migration"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Modifiers"
expression = "Modifiers"
reason = "Modifier ownership counters are updated for every key event inside the measured keyboard path; copying them would add per-event allocation."
kind = "necessity"

[[tool.workspace.architecture.exceptions]]
rule = "immutable-data"
module = "miryoku.engine"
declaration = "Engine"
expression = "Engine"
reason = "The isolated keyboard path uses bounded mutable buffers and direct updates; docs/functional-design.md records latency, allocation and GC measurements."
kind = "necessity"

[[tool.workspace.architecture.exceptions]]
