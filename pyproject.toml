[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "openai==3.35.1",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "win32more-core==0.8.7; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Contracts==0.8.10.0.28000.2705; sys_platform == 'win32'",
    "win32more-Microsoft.Windows.SDK.Win32Metadata==0.8.71.0.26; sys_platform == 'win32'",
    # Development checks; kept in the runtime group until the dev group carries them.
    "ruff==0.17.3",
    "mypy==2.4.1",
    "truststore==0.10.5",
]

[dependency-groups]
dev = ["hypothesis==6.170.12"]

[tool.uv]
# Not a package: environments hold only its dependencies (`uv sync --no-install-project`).
package = false
# Every transitive dependency stays exactly where it was pinned; `uv lock` writes uv.lock from these.
constraint-dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.10.18",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.14.0",
    "httpx==0.28.1",
    "httpx2==2.14.0",
    "idna==3.20",
    "jiter==0.17.0",
    "openai==3.35.1",
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "sniffio==1.3.1",
    "truststore==0.10.5",
    "typing_extensions==4.16.0",
    "typing-inspection==0.4.4",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "shiboken6==6.12.0; sys_platform == 'win32'",
    "win32more-core==0.8.7; sys_platform == 'win32'",
    "ast-serialize==0.13.1",
    "librt==0.16.0",
    "mypy==2.4.1",
    "mypy-extensions==1.2.0",
    "pathspec==1.1.1",
    "ruff==0.17.3",
]

[tool.mypy]
python_version = "3.15"
platform = "win32"
strict = true
# Our own code declares no Any; an Any a dependency declares is validated where it enters.
disallow_any_explicit = true
enable_error_code = ["explicit-override", "ignore-without-code"]
mypy_path = "typings"
files = ["."]
exclude = ['^\.', '/\.', '^typings/', 'node_modules', '__pycache__']

[tool.ruff]
target-version = "py315"
line-length = 150
extend-include = ["*.pyw"]
# Agent worktrees under .claude are separate checkouts with their own checks.
extend-exclude = [".claude"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "RET", "TID252", "FBT001", "FBT002"]
ignore = ["PLR2004", "PLR0911", "PLR0912"]

# Required Qt virtual methods and Win32 boundary signatures retain native names.
[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
