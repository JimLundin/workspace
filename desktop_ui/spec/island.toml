# The island bar's composition.
#
# Workspace reloads this file while it runs, with tokens.toml and controls.toml.
# A file that doesn't validate is reported and the bar keeps its last good one.

[status]
# The fixed capsule at the screen's right edge, which opens the controls menu:
# its readings left to right, in groups. Readings in a group sit close together;
# groups sit further apart. Leave a reading out to hide it.
# Readings: keyboard (only while the keyboard types plainly), speaker, wifi,
# clock, power, battery, cpu, memory.
groups = [
    ["keyboard", "speaker", "wifi"],
    ["clock", "power", "battery", "cpu", "memory"],
]

[activities]
# Where activities sit beside the centre island, left to right. The agent and a
# transcription step out of the island while you dictate, a question waits or a
# notice shows; a recording does too; the inbox's bell shows while anything waits.
# Each of agent, job, recording and inbox is placed exactly once.
lead = ["agent", "job"]
trail = ["recording", "inbox"]

[text]
phase = 28            # The agent's phase, in characters, before it elides.
title = 44            # A notice's title, in characters, before it elides.
notice_width = 340    # A notice's width, in pixels.
