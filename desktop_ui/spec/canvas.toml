# The canvas toolbar: everything the canvas does starts here.
#
# The toolbar's row holds the pinned actions below, then, while a bubble is
# selected, that bubble's pinned actions. "More", or a right click on a bubble or
# a relationship, expands the toolbar in place into the sections below, top to
# bottom; Escape or "More" collapses it. A section with nothing to show now is
# left out.
#
# Workspace reads this file each time the toolbar shows, so an edit shows on the
# next selection or expansion. A file that doesn't validate is reported and the
# toolbar uses its last good copy.
#
# Each item names an action, its label and its icon. Each action appears once
# across the sections; leave one out to reach it only from the row, or not at all.
#
# Canvas actions: center, contents (its words follow the canvas's mode, so it
# takes no label), arrange_threads, arrange_all, refresh, new_context, new_group,
# note, document, document_link, web_reference, connect_source, choose_group,
# maximize, close (the canvas window's own).
# Bubble actions: focus, contents, connect, continue, edit_work, dismiss, not_mine
# (these four on work threads only), rename_group (groups only), put_inside,
# move_to_canvas, relationships (a tile per relationship, while there are any).
# Relationship actions: edit, remove.
# Section kinds: bubble (titled with the selected bubble's name), relationship
# (titled with its reason), canvas (titled), dismissed (a tile to restore each).
# Icons: agent, arrow, bell, canvas, center, chat, check, chevron, clock, close,
# doc, down, expand, external, globe, grid, layers, link, lock, mail, menu, mic,
# more, park, plus, refresh, search, send, table, and the device symbols.

[row]
canvas = [
    { action = "note", label = "Add a note", icon = "plus" },
]
bubble = [
    { action = "focus", label = "Focus bubble", icon = "center" },
    { action = "continue", label = "Continue with agent", icon = "agent" },
    { action = "connect", label = "Connect to another bubble…", icon = "link" },
]

[[sections]]
kind = "bubble"
items = [
    { action = "focus", label = "Focus", icon = "center" },
    { action = "contents", label = "Show / hide contents", icon = "expand" },
    { action = "connect", label = "Connect…", icon = "link" },
    { action = "continue", label = "Continue with agent", icon = "agent" },
    { action = "edit_work", label = "Edit work context", icon = "doc" },
    { action = "dismiss", label = "Dismiss work", icon = "close" },
    { action = "not_mine", label = "This isn't my work", icon = "park" },
    { action = "rename_group", label = "Rename group", icon = "doc" },
    { action = "put_inside", label = "Put inside…", icon = "layers" },
    { action = "move_to_canvas", label = "Move to canvas", icon = "canvas" },
    { action = "relationships", icon = "link" },
]

[[sections]]
kind = "relationship"
items = [
    { action = "edit", label = "Edit relationship…", icon = "doc" },
    { action = "remove", label = "Remove relationship", icon = "close" },
]

[[sections]]
kind = "canvas"
title = "Add"
items = [
    { action = "new_context", label = "Work context", icon = "plus" },
    { action = "new_group", label = "Group", icon = "grid" },
    { action = "note", label = "Note", icon = "doc" },
    { action = "document", label = "Document…", icon = "doc" },
    { action = "document_link", label = "Document link…", icon = "link" },
    { action = "web_reference", label = "Web reference…", icon = "globe" },
]

[[sections]]
kind = "canvas"
title = "Arrange"
items = [
    { action = "center", label = "Center", icon = "center" },
    { action = "contents", icon = "layers" },
    { action = "arrange_threads", label = "Arrange threads", icon = "grid" },
    { action = "arrange_all", label = "Arrange all", icon = "table" },
    { action = "refresh", label = "Refresh sources", icon = "refresh" },
]

[[sections]]
kind = "canvas"
title = "Connections"
items = [
    { action = "connect_source", label = "Connect source", icon = "link" },
    { action = "choose_group", label = "Put selection inside…", icon = "layers" },
]

[[sections]]
kind = "canvas"
title = "Window"
items = [
    { action = "maximize", label = "Maximize or restore", icon = "expand" },
    { action = "close", label = "Close canvas", icon = "close" },
]

[[sections]]
kind = "dismissed"
title = "Dismissed work"
icon = "refresh"
