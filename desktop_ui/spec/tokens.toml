# The island bar's geometry, in device-independent pixels (DIPs).
#
# Workspace reloads this file while it runs: save it and the bar re-lays itself
# out. A file that doesn't validate (a missing, unknown or out-of-range value) is
# reported and the bar keeps the last good one. Every size the bar draws comes
# from here, so a change applies everywhere the value is used.

[bar]
top = 8       # From the screen's top edge to the capsules.
edge = 12     # From the screen's right edge to the right capsule.
gap = 6       # Between neighbouring capsules.
radius = 17   # A capsule's corner.
shadow = 40   # Room below and beside the capsules for their shadow.

[capsule]
# A capsule holds concentric controls: (height - control) / 2 from its edge.
height = 34
control = 28
icon = 16
spinner = 14
dot = 8       # The recording dot.
dots = 18     # Transcription's three dots.
wave_bars = 18
part_gap = 6  # Between the parts of one fact, such as a symbol and its reading.
slot_gap = 12 # Between separate facts.
text_pad = 12 # A capsule's ends when it holds text...
icon_pad = 10 # ...and when it holds only symbols.

[menu]
# The controls menu: a grid of tiles below the capsule's own row.
width = 320
radius = 21
pad = 6
head = 34     # The capsule's own row, above the grid.
track = 10    # One grid row; a tile spans whole tracks.
gutter = 8    # Between tiles; each tile keeps half on every side.

[detail]
# Lines of detail under a capsule's row.
line = 16
top = 28      # The first line, tucked into the row's lower padding.
bottom = 10
