name: Windows desktop tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  desktop:
    runs-on: [self-hosted, Windows, workspace-desktop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --with pytest
      - run: uv run --no-sync --with pytest python -m pytest -q tests/test_windows_e2e.py tests/test_windows_assistant_e2e.py
        env:
          WORKSPACE_E2E: '1'
