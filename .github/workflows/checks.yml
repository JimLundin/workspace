name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" ruff==0.17.3
      - run: python selfcheck.py --durations 10
      - run: python -m scripts.check --tests tests/properties/test_pcm.py tests/properties/test_agent_session.py
  standards:
    runs-on: windows-latest # Type-check against the actual native Qt/WinRT dependencies.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install -e ".[test]" pyright==1.1.414 ruff==0.17.3
      - run: python -m scripts.typecheck
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m scripts.quality
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/release.py dist/workspace-python315-win64.zip
      - run: python -m zipfile -e dist/workspace-python315-win64.zip dist/check
      # As the first start does: build the lock's environment from PyPI with uv, then check the release in it.
      - run: python dist/check/workspace/environments.py ensure dist/check/workspace/requirements/windows-py315.lock
      - shell: pwsh
        run: |
          $python = python dist/check/workspace/environments.py python dist/check/workspace/requirements/windows-py315.lock
          & $python dist/check/workspace/selfcheck.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-python315-win64
          path: dist/workspace-python315-win64.zip
