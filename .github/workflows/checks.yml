name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python selfcheck.py --durations 10
      - run: python -m scripts.check --tests tests/properties/test_pcm.py tests/properties/test_agent_session.py
  canvas-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_canvas_bridge.mjs
  standards:
    runs-on: windows-latest # Type-check against the actual native Qt/WinRT dependencies.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install -e ".[test]" mypy pyright ruff
      - run: mypy .
      - run: pyright
      - run: ruff check .
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install pydantic==2.14.1
      - run: python scripts/bundle.py dist/toolkit-sdk-python315-win64.zip
      - run: python -m zipfile -e dist/toolkit-sdk-python315-win64.zip dist/check
      - run: ./dist/check/toolkit/.python/python.exe dist/check/toolkit/selfcheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-sdk-python315-win64
          path: dist/toolkit-sdk-python315-win64.zip
