name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync python -m scripts.check --full
      - run: uv run --no-sync python -m scripts.check --tests tests/properties/test_pcm.py tests/properties/test_agent_session.py
  standards:
    runs-on: windows-latest # Type-check against the actual native Qt/WinRT dependencies.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync python -m scripts.typecheck
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: python -m scripts.quality
